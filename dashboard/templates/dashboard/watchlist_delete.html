{% extends "dashboard/base.html" %}

{% block title %}
    <title>Удалить из списка наблюдения</title>
{% endblock %}

{% block content %}
    <h2>Удалить из списка наблюдения</h2>
    
    <p>Вы уверены, что хотите удалить <strong>{{ object.share.name }} ({{ object.share.ticker }})</strong> из списка наблюдения?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'dashboard:watchlist' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
