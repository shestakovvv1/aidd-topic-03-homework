{% extends "dashboard/base.html" %}

{% block title %}
    <title>Добавить в список наблюдения</title>
{% endblock %}

{% block content %}
    <h2>Добавить акцию в список наблюдения</h2>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="{% url 'dashboard:watchlist' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
