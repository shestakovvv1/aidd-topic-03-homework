{% extends "dashboard/base.html" %}

{% block title %}
<title>Удалить портфель</title>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <h2>Удалить портфель «{{ object.name }}»?</h2>
        <p>Будут удалены все операции этого портфеля. Действие необратимо.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'dashboard:portfolio_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
